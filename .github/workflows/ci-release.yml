name: ci-release

on:
  pull_request:
  push:
    branches:
      - dev
      - master
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build web assets (frps)
        run: make build
        working-directory: web/frps

      - name: Build web assets (frpc)
        run: make build
        working-directory: web/frpc

      - name: Run mix-aware validation suite
        run: go test ./pkg/config/... ./pkg/transport/... ./pkg/metrics/... ./client/... ./server/...

  mix-bench:
    name: Mix Bench
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build web assets (frps)
        run: make build
        working-directory: web/frps

      - name: Build web assets (frpc)
        run: make build
        working-directory: web/frpc

      - name: Run mix benchmark harness
        run: ./hack/run-mix-bench.sh

      - name: Upload mix benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mix-bench-${{ github.ref_name }}
          path: tmp/mix-bench/*
          if-no-files-found: error

  package:
    name: Cross Build Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - mix-bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build web assets (frps)
        run: make build
        working-directory: web/frps

      - name: Build web assets (frpc)
        run: make build
        working-directory: web/frpc

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          FRP_PACKAGE_VERSION="${GITHUB_REF_NAME#v}" ./package.sh

      - name: Normalize package filenames to tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          cd release/packages
          for f in frp_*.tar.gz frp_*.zip; do
            [[ -f "$f" ]] || continue
            if [[ "$f" =~ ^frp_[^_]+_(.+)$ ]]; then
              suffix="${BASH_REMATCH[1]}"
              target="frp_${tag_version}_${suffix}"
              if [[ "$f" != "$target" ]]; then
                mv "$f" "$target"
              fi
            fi
          done

      - name: Generate release checksums
        shell: bash
        run: |
          shopt -s nullglob
          cd release/packages
          sha256sum ./* > frp_sha256_checksums.txt

      - name: Verify package version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}" python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tarfile
          import tempfile
          import zipfile

          tag_version = os.environ["TAG_VERSION"]
          pkg_dir = pathlib.Path("release/packages")
          archives = sorted(list(pkg_dir.glob("frp_*.tar.gz")) + list(pkg_dir.glob("frp_*.zip")))
          if not archives:
            raise SystemExit("no release archives found")

          prefix = f"frp_{tag_version}_"
          for archive in archives:
            name = archive.name
            if not name.startswith(prefix):
              raise SystemExit(f"asset name mismatch: {name} does not start with {prefix}")
            if name.endswith(".tar.gz"):
              with tarfile.open(archive, "r:gz") as tf:
                members = tf.getmembers()
                if not members:
                  raise SystemExit(f"empty tar archive: {name}")
                root = members[0].name.split("/", 1)[0]
            elif name.endswith(".zip"):
              with zipfile.ZipFile(archive, "r") as zf:
                names = zf.namelist()
                if not names:
                  raise SystemExit(f"empty zip archive: {name}")
                root = names[0].split("/", 1)[0]
            else:
              continue
            expected = name[:-7] if name.endswith(".tar.gz") else name[:-4]
            if root != expected:
              raise SystemExit(f"archive root mismatch: {name} has root {root}, expected {expected}")

          linux_pkg = pkg_dir / f"frp_{tag_version}_linux_amd64.tar.gz"
          if linux_pkg.exists():
            with tempfile.TemporaryDirectory() as td:
              tdp = pathlib.Path(td)
              with tarfile.open(linux_pkg, "r:gz") as tf:
                tf.extractall(tdp)
              root = tdp / f"frp_{tag_version}_linux_amd64"
              frps = root / "frps"
              if not frps.exists():
                raise SystemExit(f"linux amd64 frps binary missing in {linux_pkg.name}")
              out = subprocess.check_output([str(frps), "--version"], text=True).strip()
              if out != tag_version:
                raise SystemExit(
                  f"binary version mismatch in {linux_pkg.name}: got {out}, expected {tag_version}"
                )
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.ref_name }}
          path: release/packages/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release title
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ=Asia/Singapore date '+%Y%m%d-%H%M%S')"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "title=${stamp} ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-packages-${{ github.ref_name }}
          path: release/packages

      - name: Generate release notes
        run: ./hack/generate-release-notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release/packages -maxdepth 1 -type f | sort)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${{ steps.release_meta.outputs.title }}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "${{ steps.release_meta.outputs.title }}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --latest
          fi
