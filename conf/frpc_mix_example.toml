serverAddr = "127.0.0.1"

# The mix client uses the same two fields as frps. The order determines
# fallback and failback priority on the client side.
mixBindPort = 7000
# Optional ordered host fallback list. Each item is HOST or HOST:PORT.
# If PORT is omitted, mixBindPort is used.
# mixFallbackHosts = "10.20.0.65,kr.goodfood.com:7002,[2401:c080:1c02:aaf:5400:4ff:fe78:d01f]:7007"
mixToken = "kcp://kcppass,quic://quicpass,ss://aes-256-gcm:sspass,wss://wsspass,ssh://user:sshpass,tcp://tcppass"

auth.method = "token"
auth.token = "12345678"

# mix mode ignores loginFailExit during initial dial so fallback can continue.
loginFailExit = false

log.to = "console"
log.level = "info"

[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000
